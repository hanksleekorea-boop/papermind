<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 3 - LinkMax Frontend</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .container { background: #1e293b; padding: 3rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); max-width: 600px; text-align: center; }
        h1 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; line-height: 1.6; }
        .badge { background: #0369a1; color: white; padding: 4px 8px; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; margin-bottom: 1rem; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Phase 3: Frontend PWA / WebXR</div>
        <h1 id="title">System Online</h1>
        <p>The Cloudflare Edge API and Agentic AI modules are fully operational. This frontend shell is served directly from the Edge Worker with 0ms latency routing.</p>
        <p id="status">Connecting to backend APIs...</p>
    </div>
    <script>
        setTimeout(() => {
            document.getElementById("status").textContent = "Connected. APIs and Webhooks are active.";
            document.getElementById("status").style.color = "#34d399";
        }, 1000);
    </script>
</body>
</html>
